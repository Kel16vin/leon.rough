<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon-removebg-preview.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Admin Login | Elite Maintenance Services Ltd.</title>
</head>
<body class="min-h-screen">
  <div class="login-layout min-h-screen grid md:grid-cols-[42%_58%]">
    <div class="login-left flex items-center justify-start px-6 py-10">
      <div class="login-card bg-white rounded-[32px] border border-slate-200 p-8 shadow-[0_24px_60px_rgba(15,23,42,0.12)] max-w-md md:ml-0 ml-auto">
        <div class="text-left mb-8">
          <img src="logo-removebg-preview.png" alt="Elite Maintenance Services Ltd. Logo" class="h-16 mb-6">
          <p class="text-sm font-semibold text-[#1d5db4] uppercase tracking-[0.24em] mb-3">Log in to your account</p>
          <h1 class="text-3xl font-bold text-slate-900 mb-3">Admin Sign In</h1>
          <p class="text-slate-500">Enter your username and password to access booking records.</p>
        </div>

        <div id="loginError" class="hidden mb-6 rounded-3xl bg-red-50 border border-red-200 text-red-700 px-4 py-3"></div>

        <form action="/login" method="POST" class="space-y-5">
          <div>
            <label for="username" class="block text-slate-700 mb-2 font-semibold">Username</label>
            <input id="username" name="username" type="text" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-[#1d5db4] focus:ring-2 focus:ring-[#1d5db4]/20" />
          </div>
          <div>
            <label for="password" class="block text-slate-700 mb-2 font-semibold">Password</label>
            <input id="password" name="password" type="password" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-[#1d5db4] focus:ring-2 focus:ring-[#1d5db4]/20" />
          </div>
          <button type="submit" class="w-full rounded-3xl bg-[#1d5db4] px-5 py-4 text-base font-bold text-white shadow-lg shadow-[#1d5db4]/20 hover:bg-[#16478e] transition">Sign In</button>
        </form>
      </div>
    </div>
    <div class="login-right hidden md:block"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const loginError = document.getElementById('loginError');
    if (params.get('error') === '1') {
      loginError.textContent = 'Invalid credentials. Please try again.';
      loginError.classList.remove('hidden');
    }
  </script>
</body>
</html>
