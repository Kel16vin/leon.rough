<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon-removebg-preview.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Booking Admin | Elite Maintenance Services Ltd.</title>
</head>
<body class="bg-black text-white overflow-x-hidden">
  <section class="min-h-screen py-12 px-4 md:px-8">
    <div class="container mx-auto">
      <div class="glass rounded-3xl border border-white/5 p-8 shadow-xl">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
          <div>
            <h1 class="text-3xl font-bold text-white">Booking Submissions</h1>
            <p class="text-slate-400 mt-2">View all appointments submitted through the booking form.</p>
          </div>
          <div class="flex items-center gap-3">
            <button id="refreshButton" class="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 transition">
              <i class="fas fa-sync-alt"></i> Refresh
            </button>
            <a href="/logout" class="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 transition text-slate-200">
              <i class="fas fa-sign-out-alt"></i> Logout
            </a>
          </div>
        </div>

        <div id="statusMessage" class="text-slate-300 mb-6"></div>

        <div class="overflow-x-auto">
          <table class="min-w-full text-left border-collapse bg-slate-950 rounded-3xl overflow-hidden">
            <thead class="bg-slate-900 text-slate-300 uppercase text-xs tracking-wider">
              <tr>
                <th class="px-4 py-3">ID</th>
                <th class="px-4 py-3">Name</th>
                <th class="px-4 py-3">Phone</th>
                <th class="px-4 py-3">Service</th>
                <th class="px-4 py-3">Preferred Date</th>
                <th class="px-4 py-3">Urgency</th>
                <th class="px-4 py-3">Submitted</th>
                <th class="px-4 py-3">Actions</th>
              </tr>
            </thead>
            <tbody id="bookingRows" class="bg-slate-950 text-slate-200"></tbody>
          </table>
        </div>

        <div class="mb-8 rounded-3xl border border-white/5 bg-slate-900 p-6">
          <h2 class="text-xl font-semibold text-white mb-4">Add Submission Manually</h2>
          <div class="grid gap-4 md:grid-cols-2">
            <input id="inputFullName" class="rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-slate-200" type="text" placeholder="Full name" />
            <input id="inputPhone" class="rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-slate-200" type="text" placeholder="Phone" />
            <input id="inputEmail" class="rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-slate-200" type="email" placeholder="Email" />
            <input id="inputContactMethod" class="rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-slate-200" type="text" placeholder="Preferred contact method" />
            <input id="inputServiceType" class="rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-slate-200" type="text" placeholder="Service type" />
            <input id="inputCustomService" class="rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-slate-200" type="text" placeholder="Custom service (optional)" />
            <input id="inputPreferredDate" class="rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-slate-200" type="date" placeholder="Preferred date" />
            <input id="inputPreferredTime" class="rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-slate-200" type="time" placeholder="Preferred time" />
            <input id="inputUrgency" class="rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-slate-200" type="text" placeholder="Urgency" />
            <textarea id="inputDescription" class="col-span-full rounded-3xl border border-white/10 bg-slate-950 px-4 py-3 text-slate-200" rows="3" placeholder="Description"></textarea>
            <div class="col-span-full flex flex-wrap items-center gap-4">
              <label class="inline-flex items-center gap-2 text-slate-300">
                <input id="inputAgreeUpdates" type="checkbox" class="h-4 w-4 rounded border-slate-700 bg-slate-950 text-blue-600" />
                Receive updates
              </label>
              <button id="addBookingButton" class="ml-auto rounded-xl bg-green-600 px-5 py-3 text-white hover:bg-green-700 transition">Add submission</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const bookingRows = document.getElementById('bookingRows');
    const statusMessage = document.getElementById('statusMessage');
    const refreshButton = document.getElementById('refreshButton');
    let currentBookings = [];

    function formatDate(value) {
      return value ? new Date(value).toLocaleString('en-GB', {
        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      }) : '';
    }

    function renderRows(bookings) {
      if (!bookings.length) {
        bookingRows.innerHTML = '<tr><td colspan="8" class="px-4 py-6 text-center text-slate-400">No bookings found.</td></tr>';
        return;
      }

      bookingRows.innerHTML = bookings.map(booking => `
        <tr class="border-t border-white/10 hover:bg-slate-900/80">
          <td class="px-4 py-4 text-slate-300">${booking.id}</td>
          <td class="px-4 py-4">${booking.fullName}</td>
          <td class="px-4 py-4">${booking.phone}</td>
          <td class="px-4 py-4">${booking.serviceType}${booking.customService ? ` — ${booking.customService}` : ''}</td>
          <td class="px-4 py-4">${booking.preferredDate || 'N/A'}</td>
          <td class="px-4 py-4">${booking.urgency || 'N/A'}</td>
          <td class="px-4 py-4">${formatDate(booking.createdAt)}</td>
          <td class="px-4 py-4">
            <div class="relative">
              <button type="button" onclick="toggleActionsMenu('actions-${booking.id}')" class="w-full rounded-xl bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 transition" title="Open actions menu">Actions</button>
              <div id="actions-${booking.id}" class="hidden absolute right-0 z-10 mt-2 w-44 overflow-hidden rounded-2xl border border-white/10 bg-slate-950 text-sm shadow-2xl shadow-black/20">
                <button type="button" onclick="openDocument(${booking.id}, 'invoice')" class="block w-full px-4 py-3 text-left text-slate-200 hover:bg-slate-900">Generate invoice</button>
                <button type="button" onclick="openDocument(${booking.id}, 'quotation')" class="block w-full px-4 py-3 text-left text-slate-200 hover:bg-slate-900">Generate quotation</button>
                <button type="button" onclick="openDocument(${booking.id}, 'receipt')" class="block w-full px-4 py-3 text-left text-slate-200 hover:bg-slate-900">Generate receipt</button>
                <div class="border-t border-white/10"></div>
                <button type="button" onclick="deleteBooking(${booking.id})" class="block w-full px-4 py-3 text-left text-red-400 hover:bg-slate-900">Delete</button>
              </div>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function loadBookings() {
      statusMessage.textContent = 'Loading bookings...';
      try {
        const response = await fetch('/api/bookings');
        if (!response.ok) throw new Error('Failed to load bookings');
        const bookings = await response.json();
        currentBookings = bookings;
        renderRows(bookings);
        statusMessage.textContent = `Loaded ${bookings.length} booking${bookings.length === 1 ? '' : 's'}.`;
      } catch (error) {
        statusMessage.textContent = 'Unable to load bookings. Check the backend server.';
        bookingRows.innerHTML = '<tr><td colspan="8" class="px-4 py-6 text-center text-red-400">Error loading bookings.</td></tr>';
      }
    }

    function toggleActionsMenu(menuId) {
      closeAllActionMenus();
      const menu = document.getElementById(menuId);
      if (menu) menu.classList.toggle('hidden');
    }

    function closeAllActionMenus() {
      document.querySelectorAll('.actions-menu > div').forEach(menu => menu.classList.add('hidden'));
    }

    window.addEventListener('click', event => {
      if (!event.target.closest('.actions-menu')) {
        closeAllActionMenus();
      }
    });

    function openDocument(id, type) {
      closeAllActionMenus();
      const booking = currentBookings.find(item => item.id === id);
      if (!booking) {
        statusMessage.textContent = 'Unable to find booking to generate document.';
        return;
      }
      const title = type.charAt(0).toUpperCase() + type.slice(1);
      const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>${title} #${booking.id}</title>
<style>
 body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; background: #111827; color: #f8fafc; }
 .page { max-width: 900px; margin: auto; background: #0f172a; padding: 32px; border-radius: 24px; border: 1px solid rgba(255,255,255,.08); }
 h1 { margin-bottom: 12px; }
 .section { margin-top: 24px; }
 .row { display: grid; grid-template-columns: 240px 1fr; gap: 12px; margin-bottom: 12px; }
 .label { color: #94a3b8; }
 .value { color: #e2e8f0; }
 .footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.08); color: #94a3b8; }
 button { background: #2563eb; color: white; border: none; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
</style>
</head>
<body>
<div class="page">
  <h1>${title}</h1>
  <div class="section"><strong>Booking ID:</strong> ${booking.id}</div>
  <div class="row"><div class="label">Name</div><div class="value">${booking.fullName}</div></div>
  <div class="row"><div class="label">Phone</div><div class="value">${booking.phone}</div></div>
  <div class="row"><div class="label">Email</div><div class="value">${booking.email || 'n/a'}</div></div>
  <div class="row"><div class="label">Service</div><div class="value">${booking.serviceType}${booking.customService ? ` — ${booking.customService}` : ''}</div></div>
  <div class="row"><div class="label">Preferred Date</div><div class="value">${booking.preferredDate || 'N/A'}</div></div>
  <div class="row"><div class="label">Preferred Time</div><div class="value">${booking.preferredTime || 'N/A'}</div></div>
  <div class="row"><div class="label">Urgency</div><div class="value">${booking.urgency || 'N/A'}</div></div>
  <div class="section"><strong>Description</strong><p>${booking.description}</p></div>
  <div class="footer">Generated ${title.toLowerCase()} for Elite Maintenance Services Ltd.</div>
</div>
</body>
</html>`;
      const docWindow = window.open('', '_blank');
      if (!docWindow) {
        statusMessage.textContent = 'Popup blocked. Please allow popups to generate documents.';
        return;
      }
      docWindow.document.write(html);
      docWindow.document.close();
      docWindow.focus();
    }

    document.getElementById('addBookingButton').addEventListener('click', async () => {
      const booking = {
        fullName: document.getElementById('inputFullName').value.trim(),
        phone: document.getElementById('inputPhone').value.trim(),
        email: document.getElementById('inputEmail').value.trim(),
        contactMethod: document.getElementById('inputContactMethod').value.trim(),
        serviceType: document.getElementById('inputServiceType').value.trim(),
        customService: document.getElementById('inputCustomService').value.trim(),
        preferredDate: document.getElementById('inputPreferredDate').value,
        preferredTime: document.getElementById('inputPreferredTime').value,
        urgency: document.getElementById('inputUrgency').value.trim(),
        description: document.getElementById('inputDescription').value.trim(),
        agreeUpdates: document.getElementById('inputAgreeUpdates').checked
      };

      if (!booking.fullName || !booking.phone || !booking.serviceType || !booking.description) {
        statusMessage.textContent = 'Full name, phone, service type, and description are required.';
        return;
      }

      statusMessage.textContent = 'Adding submission...';

      try {
        const response = await fetch('/api/bookings/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(booking)
        });

        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || 'Unable to add submission');
        }

        statusMessage.textContent = 'Submission added successfully.';
        clearForm();
        loadBookings();
      } catch (error) {
        statusMessage.textContent = error.message || 'Unable to add submission.';
      }
    });

    async function deleteBooking(id) {
      if (!confirm('Delete submission #' + id + '?')) return;
      statusMessage.textContent = 'Deleting submission...';
      try {
        const response = await fetch('/api/bookings/' + id, { method: 'DELETE' });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || 'Unable to delete submission');
        }
        statusMessage.textContent = 'Submission deleted.';
        loadBookings();
      } catch (error) {
        statusMessage.textContent = error.message || 'Unable to delete submission.';
      }
    }

    function clearForm() {
      document.getElementById('inputFullName').value = '';
      document.getElementById('inputPhone').value = '';
      document.getElementById('inputEmail').value = '';
      document.getElementById('inputContactMethod').value = '';
      document.getElementById('inputServiceType').value = '';
      document.getElementById('inputCustomService').value = '';
      document.getElementById('inputPreferredDate').value = '';
      document.getElementById('inputPreferredTime').value = '';
      document.getElementById('inputUrgency').value = '';
      document.getElementById('inputDescription').value = '';
      document.getElementById('inputAgreeUpdates').checked = false;
    }

    refreshButton.addEventListener('click', loadBookings);
    loadBookings();
  </script>
</body>
</html>
